# =============================================================================
# UNNC AIM team canonical Python formatting / lint config
# -----------------------------------------------------------------------------
# Rule: follow PEP 8, format with autopep8 (see .github/profile/standard.py.md)
# Line length: max-line-length = 79
#   (matches the bare `autopep8` default used in aim-py-2526-courseworks CI;
#    changing to 99/100 would break that repo's CI)
# Usage:
#   Format:       autopep8 --in-place --recursive --max-line-length 79 .
#   Sort imports: isort .
#   Check:        flake8 .          or   autopep8 --diff .
#   VSCode:       install the ms-python.autopep8 extension, enable Format On Save
#   PyCharm:      Preferences -> Tools -> Actions on Save -> check "Reformat code"
# NOTE: ROS2 ament_python repos usually already have a setup.cfg with
#       [develop]/[install] sections. MERGE the [flake8] / [autopep8] / [isort]
#       sections below into it — do NOT overwrite the existing ROS install config!
# =============================================================================

[flake8]
max-line-length = 79
extend-ignore =
    E203,
    W503
exclude =
    .git,
    __pycache__,
    build,
    develop,
    install,
    dist,
    log,
    .venv,
    venv

[autopep8]
max_line_length = 79
# aggression defaults to level 1 (matches CI); set aggressive = 2 for more cleanup

[isort]
# Import sorting: stdlib / third-party / first-party(local), blank line between groups.
# autopep8 does NOT sort imports — run isort for that. `profile = black` is only an
# isort multi-line preset (the team does NOT use black). line_length 79 = autopep8/flake8.
#   Run: isort .        Check: isort --check-only --diff .
profile = black
line_length = 79
